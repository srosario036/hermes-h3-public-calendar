name: H3 private Telegram report
on:
  schedule:
    - cron: '57 5,6 * * *'
    - cron: '17 7-22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Verify without sending, preview, or recover today's daily report
        type: choice
        options: [verify, preview, send]
        default: verify
permissions:
  contents: read
  id-token: write
concurrency:
  group: h3-telegram-single-sender
  cancel-in-progress: false
jobs:
  report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Wait for Madrid daily target when starting slightly early
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os,time
          from datetime import datetime
          from zoneinfo import ZoneInfo
          if os.environ['EVENT_NAME']=='schedule':
              now=datetime.now(ZoneInfo('Europe/Madrid'))
              wait=(now.replace(hour=8,minute=0,second=0,microsecond=0)-now).total_seconds()
              if 0<wait<=240:time.sleep(wait)
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Deliver current-day report or confirm its durable deduplication
        env:
          H3_REPORT_CONFIG: ${{ secrets.H3_REPORT_CONFIG }}
          H3_HOSTED_RUNNER: '1'
          REPORT_MODE: ${{ github.event_name == 'schedule' && 'send' || inputs.mode }}
        run: |
          set +x
          umask 077
          python3 - <<'PY'
          import os,subprocess,sys
          args=[sys.executable,'h3_reporting/h3_offline_report.py','--auth','github','--output',os.environ['RUNNER_TEMP']+'/h3-report']
          if os.environ['REPORT_MODE']=='send':args+=['--send']
          elif os.environ['REPORT_MODE']=='verify':args+=['--verify-bot']
          raise SystemExit(subprocess.run(args).returncode)
          PY
