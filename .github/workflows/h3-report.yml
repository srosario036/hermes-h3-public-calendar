name: H3 private Telegram report
on:
  schedule:
    - cron: '57 5,6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Non-sending verification, preview, or scheduled send
        type: choice
        options: [verify, preview, send]
        default: verify
permissions:
  contents: read
  id-token: write
concurrency:
  group: h3-telegram-single-sender
  cancel-in-progress: false
jobs:
  report:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check Madrid reporting window
        id: window
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PY'
          import os,time
          from datetime import datetime,timezone
          from zoneinfo import ZoneInfo
          allowed=True
          if os.environ['EVENT_NAME']=='schedule':
              now=datetime.now(ZoneInfo('Europe/Madrid'));target=now.replace(hour=8,minute=0,second=0,microsecond=0)
              wait=(target-now).total_seconds()
              if 0<wait<=240:time.sleep(wait)
              now=datetime.now(ZoneInfo('Europe/Madrid'));allowed=now.hour==8 and now.minute<5
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              print('allowed='+str(allowed).lower(),file=f)
          PY
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        if: steps.window.outputs.allowed == 'true'
        with:
          persist-credentials: false
      - name: Read H3 evidence and report once
        if: steps.window.outputs.allowed == 'true'
        env:
          H3_REPORT_CONFIG: ${{ secrets.H3_REPORT_CONFIG }}
          H3_HOSTED_RUNNER: '1'
          REPORT_MODE: ${{ github.event_name == 'schedule' && 'send' || inputs.mode }}
        run: |
          set +x
          umask 077
          python3 - <<'PY'
          import os,subprocess,sys
          args=[sys.executable,'h3_reporting/h3_offline_report.py','--auth','github','--output',os.environ['RUNNER_TEMP']+'/h3-report']
          if os.environ['REPORT_MODE']=='send':args+=['--send']
          elif os.environ['REPORT_MODE']=='verify':args+=['--verify-bot']
          rc=subprocess.run(args).returncode
          if rc==0 and os.environ['REPORT_MODE']=='verify':
              import json,uuid
              from datetime import datetime,timezone
              sys.path.insert(0,'h3_reporting')
              from h3_offline_report import Google,access_token
              cfg=json.loads(os.environ['H3_REPORT_CONFIG']);g=Google(access_token('github',cfg),cfg)
              g.event({'state':'identity_probe','at':datetime.now(timezone.utc).isoformat(),'runner':os.environ['GITHUB_EVENT_NAME'],'attempt':uuid.uuid4().hex})
              print('Private ledger write verified; no Telegram sent')
          raise SystemExit(rc)
          PY
