name: Official BLS iCalendar probe
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */2 * * *' # Low-cost acquisition monitoring; scheduled execution not yet proven.
concurrency:
  group: official-calendar
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  probe:
    if: github.repository == 'srosario036/hermes-h3-public-calendar' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Request the exact official iCalendar URL once
        id: probe
        shell: bash
        run: |
          python3 - <<'PY'
          import datetime,hashlib,json,os,pathlib,urllib.request,urllib.error
          from zoneinfo import ZoneInfo
          import re
          
          def validate_ics(raw):
              text=raw.decode('utf-8-sig')
              lines=[]
              for line in text.splitlines():
                  if line.startswith((' ','\t')):
                      if not lines:raise ValueError('orphan_fold')
                      lines[-1]+=line[1:]
                  else:lines.append(line)
              lines=[x for x in lines if x]
              if lines[0]!='BEGIN:VCALENDAR' or lines[-1]!='END:VCALENDAR' or lines.count('VERSION:2.0')!=1:raise ValueError('calendar_envelope')
              stack=[];events=[];current=None
              for line in lines:
                  if line.startswith('BEGIN:'):
                      component=line[6:];stack.append(component)
                      if component=='VEVENT':
                          if current is not None:raise ValueError('nested_event')
                          current={}
                  elif line.startswith('END:'):
                      component=line[4:]
                      if not stack or stack.pop()!=component:raise ValueError('component_integrity')
                      if component=='VEVENT':events.append(current);current=None
                  elif current is not None:
                      if ':' not in line:raise ValueError('invalid_property')
                      key,value=line.split(':',1)
                      if key in current:raise ValueError('duplicate_property')
                      current[key]=value
              if stack or not events:raise ValueError('truncated_or_empty')
              required=['TZID:US-Eastern','RRULE:FREQ=YEARLY;BYMONTH=3;BYDAY=2SU','RRULE:FREQ=YEARLY;BYMONTH=11;BYDAY=1SU','TZOFFSETFROM:-0500','TZOFFSETTO:-0400','TZOFFSETFROM:-0400','TZOFFSETTO:-0500']
              if not all(x in lines for x in required):raise ValueError('unverified_vendor_timezone')
              ny=ZoneInfo('America/New_York');uids=set();rows=[];missing_stamp=0
              for e in events:
                  uid=e.get('UID');name=e.get('SUMMARY');start=e.get('DTSTART;TZID=US-Eastern')
                  if not uid or uid in uids or not name or not start:raise ValueError('event_identity_or_time')
                  uids.add(uid)
                  dt=datetime.datetime.strptime(start,'%Y%m%dT%H%M%S').replace(tzinfo=ny)
                  if dt.astimezone(datetime.timezone.utc).astimezone(ny)!=dt:raise ValueError('timezone_roundtrip')
                  if dt.hour not in (8,10) or dt.minute not in (0,30):raise ValueError('unexpected_release_time')
                  missing_stamp+=int('DTSTAMP' not in e)
                  rows.append({'uid':uid,'name':name,'at':dt.isoformat(),'utc':dt.astimezone(datetime.timezone.utc).isoformat()})
              expected=[('03','10:00','Job Openings and Labor Turnover Survey'),('05','08:30','Productivity and Costs'),('06','08:30','Employment Situation'),('10','08:30','Consumer Price Index'),('10','08:30','Real Earnings'),('13','08:30','Producer Price Index'),('17','08:30','U.S. Import and Export Price Indexes'),('18','10:00','Employer-Reported Workplace Injuries and Illnesses (Annual)'),('20','10:00','State Employment and Unemployment (Monthly)'),('20','10:00','Total Factor Productivity for Major Industries')]
              observed={(r['at'][:10],r['at'][11:16],r['name']) for r in rows if r['at'].startswith('2026-11')}
              missing=[{'date':'2026-11-'+d,'time':t,'name':n} for d,t,n in expected if ('2026-11-'+d,t,n) not in observed]
              return {'parsed_vendor_subset':True,'strict_RFC5545_valid':missing_stamp==0,'missing_required_DTSTAMP':missing_stamp,'events':len(rows),'unique_UIDs':len(uids),'first':min(r['at'] for r in rows),'last':max(r['at'] for r in rows),'timezone':'America/New_York','vendor_TZID':'US-Eastern','january_UTC_offset':str(datetime.datetime(2026,1,15,tzinfo=ny).utcoffset()),'july_UTC_offset':str(datetime.datetime(2026,7,15,tzinfo=ny).utcoffset()),'november_events':len(observed),'november_expected_in_reviewed_official_HTML':len(expected),'missing_from_reviewed_official_HTML':missing,'comparison_source':'https://www.bls.gov/schedule/2026/11_sched_list.htm','comparison_checked_at':'2026-11-20T11:22:53+00:00','comparison_valid_until':'2026-11-20T17:22:53+00:00','comparison_is_pinned_review_not_automatic_HTML_fetch':True,'provider_publication_per_event':'unknown','coverage':'unknown','coverage_GO':False,'consumer_integration_verified':False,'rows':rows}
          
          source='https://www.bls.gov/schedule/news_release/bls.ics'
          root=pathlib.Path('site')
          before={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.glob('latest*') if p.is_file()}
          evidence={'source':source,'run_id':os.environ['GITHUB_RUN_ID'],'run_attempt':os.environ['GITHUB_RUN_ATTEMPT'],'trigger':os.environ['GITHUB_EVENT_NAME'],'request_started_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'requests':1,'coverage':'unknown','consumer_integration_verified':False,'latest_before':before}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*a,**kw):return None
          try:
              opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect)
              with opener.open(urllib.request.Request(source,headers={'User-Agent':'Public-official-calendar-integrity/1.0','Accept':'text/calendar'}),timeout=25) as response:
                  raw=response.read(2_000_001)
                  evidence.update(http_status=response.status,final_url=response.geturl(),content_type=response.headers.get('Content-Type'),server_date=response.headers.get('Date'),last_modified=response.headers.get('Last-Modified'),bytes=len(raw),body_sha256=hashlib.sha256(raw).hexdigest())
              if evidence['http_status']==200 and evidence['final_url']==source and len(raw)<=2_000_000:
                  path=root/'ics-probe'/('candidate-'+os.environ['GITHUB_RUN_ID']+'.ics');path.parent.mkdir(parents=True,exist_ok=True);path.write_bytes(raw)
                  evidence['candidate_saved']=True
                  evidence['validation']=validate_ics(raw)
                  prior={}
                  for saved in sorted((root/'ics-probe').glob('candidate-*.ics')):
                      prior[saved.name]={'body_sha256':hashlib.sha256(saved.read_bytes()).hexdigest(),'validation':validate_ics(saved.read_bytes())}
                  evidence['independent_saved_candidate_checks']=prior
              else:evidence['validation']='response_invalid'
          except Exception as error:
              evidence.update(http_status=getattr(error,'code',None),error_type=type(error).__name__,validation='not_possible_without_successful_acquisition')
          evidence['response_completed_at']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          evidence['latest_after']={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in root.glob('latest*') if p.is_file()}
          evidence['latest_preserved']=evidence['latest_before']==evidence['latest_after']
          path=root/'ics-probe'/('attempt-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']+'.json')
          path.parent.mkdir(parents=True,exist_ok=True);path.write_text(json.dumps(evidence,indent=2)+chr(10))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('status='+str(evidence.get('http_status'))+chr(10))
          print(json.dumps(evidence))
          PY
      - name: Probe five critical official series once, without repeated HTML retries
        shell: bash
        run: |
          python3 - <<'PY'
          import concurrent.futures,datetime,hashlib,json,pathlib,urllib.request,urllib.error
          target=pathlib.Path('site/ics-probe/critical-source-probe.json')
          if target.exists():
              print('One-shot critical-source probe already recorded; no new HTML requests.')
              raise SystemExit(0)
          sources={name:'https://www.bls.gov/schedule/news_release/'+page+'.htm' for name,page in [('CPI','cpi'),('PPI','ppi'),('Employment','empsit'),('JOLTS','jolts'),('ECI','eci')]}
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*a,**kw):return None
          def probe(item):
              name,url=item
              record={'series':name,'source':url,'request_started_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'coverage_GO':False}
              try:
                  opener=urllib.request.build_opener(urllib.request.ProxyHandler({}),NoRedirect)
                  with opener.open(urllib.request.Request(url,headers={'User-Agent':'Public-official-calendar-integrity/1.0','Accept':'text/html'}),timeout=25) as response:
                      raw=response.read(2_000_001)
                      record.update(http_status=response.status,final_url=response.geturl(),bytes=len(raw),sha256=hashlib.sha256(raw).hexdigest())
                  if record['http_status']==200 and record['final_url']==url and len(raw)<=2_000_000:
                      target.parent.mkdir(parents=True,exist_ok=True)
                      (target.parent/('critical-'+name+'.html')).write_bytes(raw)
                      record['status']='original_saved_validation_pending'
                  else:record['status']='response_invalid'
              except Exception as error:record.update(http_status=getattr(error,'code',None),error_type=type(error).__name__,status='coverage_unknown')
              record['response_completed_at']=datetime.datetime.now(datetime.timezone.utc).isoformat()
              return record
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:results=list(pool.map(probe,sources.items()))
          target.parent.mkdir(parents=True,exist_ok=True)
          target.write_text(json.dumps({'scope':'Official critical BLS series only; one request per URL; no variants or automatic retries','checked_at':datetime.datetime.now(datetime.timezone.utc).isoformat(),'coverage_GO':False,'results':results},indent=2)+chr(10))
          print(json.dumps({'critical_sources_recorded':len(results),'HTTP_statuses':[r.get('http_status') for r in results],'coverage_GO':False}))
          PY
      - name: Persist only public probe evidence
        shell: bash
        run: |
          git config user.name 'public-calendar-bot'
          git config user.email 'calendar-bot@users.noreply.github.com'
          git add -- site/ics-probe
          if ! git diff --cached --quiet; then
            git commit -m 'Record exact official BLS iCalendar probe'
            git push origin HEAD:main
          fi
      - name: Keep failed acquisition visible
        if: steps.probe.outputs.status != '200'
        run: exit 1

